name: Build and Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: initial-release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/VNCore/VNCore.csproj

      - name: Build
        run: dotnet build ./src/VNCore/VNCore.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test ./src/VNCore/VNCore.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack ./src/VNCore/VNCore.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ManWithBaguette
        
      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
