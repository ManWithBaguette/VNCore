name: Build and Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: initial-release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Standard Build
      - name: Build Standard
        run: dotnet build ./src/VNCore/VNCore.csproj --configuration Release

      - name: Pack Standard
        run: dotnet pack ./src/VNCore/VNCore.csproj --configuration Release --output ./artifacts

      # Godot Build
      - name: Build Godot
        run: dotnet build ./src/Godot/Godot.csproj --configuration Release

      - name: Pack Godot
        run: dotnet pack ./src/Godot/Godot.csproj --configuration Release --output ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ManWithBaguette
        
      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
