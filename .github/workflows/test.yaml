name: Run Tests

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/VNCore.Test/VNCore.Test.csproj

      - name: Build
        run: dotnet build tests/VNCore.Test/VNCore.Test.csproj --no-restore

      - name: Run tests
        run: dotnet run --project tests/VNCore.Test/VNCore.Test.csproj --no-build